spring:
  application:
    name: tramita

  # Sin defaults para secretos: si falta una variable, el arranque falla (fail-fast, patrón Convenia)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # Flyway es el dueño del schema; Hibernate solo valida (Flyway-valida-Hibernate)
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      # Debe coincidir con la validación del formulario y del servicio documental.
      max-file-size: 5MB
      max-request-size: 6MB

# Allowlist de orígenes del SPA (research.md D9): coma-separada, sin comodín;
# sin default — si falta la variable, el arranque falla (fail-fast)
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  documents:
    # Directorio configurable para no guardar binarios dentro de PostgreSQL.
    storage-path: ${APP_DOCUMENTS_STORAGE_PATH:./data/documents}
  notifications:
    # Dirección remitente usada cuando SMTP está configurado; vacía = fallback manual.
    from-email: ${APP_NOTIFICATIONS_FROM_EMAIL:}
  ai:
    # OpenRouter permanece apagado hasta contar con fuentes institucionales validadas.
    enabled: ${APP_AI_ENABLED:false}
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:}
    max-tokens: ${OPENROUTER_MAX_TOKENS:500}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:20}
    max-requests: ${OPENROUTER_MAX_REQUESTS:10}
    window-seconds: ${OPENROUTER_WINDOW_SECONDS:60}
    # Segundo modelo si el principal falla tras los reintentos (vacío = sin fallback).
    fallback-model: ${OPENROUTER_FALLBACK_MODEL:}
    # Evita repetir la misma consulta al proveedor dentro de la ventana (0 = sin caché).
    cache-ttl-seconds: ${OPENROUTER_CACHE_TTL_SECONDS:120}

  # Protección del canal público de captura del DO-FR-100 (004, FR-016 a FR-019).
  #
  # Estos números protegen la DISPONIBILIDAD del enlace, no un secreto: el canal no
  # guarda nada que valga la pena robar, pero si deja de responder el trámite no
  # arranca. Por eso son holgados a propósito — un script de abuso hace más de 100
  # peticiones por segundo y se corta igual con 20 que con 5, de modo que bajar el
  # umbral no agrega protección y sí agrega probabilidad de bloquear a un estudiante
  # legítimo, que es el único fallo que este canal no puede permitirse.
  #
  # Calibrados contra el volumen real: 30-40 solicitudes por semestre repartidas en
  # los primeros meses (entrevista a la Coordinación), o sea menos de una por día
  # hábil en toda la sede. La ventana es corta porque no gradúa la severidad del
  # límite sino cuánto dura el bloqueo cuando se equivoca. Ver research.md D3-bis.
  public-capture:
    max-submissions: 20
    window: 15m
    max-body-size: 256KB

server:
  # Sin proxy delante, NONE es lo correcto: getRemoteAddr() ya trae la IP del cliente.
  #
  # ⚠️ AL DESPLEGAR detrás de un proxy (Cloudflare, nginx, el del proveedor) hay que
  # cambiarlo a NATIVE y declarar el proxy en server.tomcat.remoteip.internal-proxies.
  # Si no se hace, getRemoteAddr() devuelve la IP DEL PROXY y los envíos de todo el
  # mundo se cuentan contra una única clave: el canal se bloquea para toda la sede,
  # que es exactamente el fallo que el límite existe para prevenir (research.md D3-bis).
  #
  # ⛔ internal-proxies NUNCA vacío: eso confía en cualquier proxy y permite que el
  # cliente se invente el X-Forwarded-For y evada el límite a voluntad.
  # https://docs.spring.io/spring-boot/how-to/webserver.html#howto.webserver.use-behind-a-proxy-server
  forward-headers-strategy: NONE

  servlet:
    session:
      # Expiración por inactividad (FR-009)
      timeout: 30m
      # Cookie de sesión endurecida (FR-008, research.md D3);
      # en el perfil dev se desactiva solo el flag Secure (application-dev.yml)
      cookie:
        name: TRAMITA_SESSION
        http-only: true
        secure: true
        same-site: strict
